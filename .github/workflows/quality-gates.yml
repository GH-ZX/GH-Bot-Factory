name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  JWT_SECRET_KEY: "ci-only-jwt-secret-key-with-at-least-32-bytes"
  APP_ENV: "test"
  CI: "true"

jobs:
  fast-verification:
    name: Fast verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Capture dependency snapshot
        run: |
          mkdir -p artifacts
          python -m pip freeze --all > artifacts/pip-freeze.txt
          python --version > artifacts/runtime.txt
          node --version >> artifacts/runtime.txt

      - name: Check committed whitespace
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^..HEAD
          else
            git diff --check
          fi

      - name: Run canonical fast gate
        run: ./scripts/verify.sh fast

      - name: Audit installed Python dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --strict

      - name: Build immutable production image
        run: docker build --pull --tag gh-bot-factory:ci .

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fast-verification-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error

  postgres-concurrency:
    name: PostgreSQL concurrency invariants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gh_bot_factory_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gh_bot_factory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gh_bot_factory_test
      POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/gh_bot_factory_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Capture dependency snapshot
        run: |
          mkdir -p artifacts
          python -m pip freeze --all > artifacts/pip-freeze.txt
          python --version > artifacts/runtime.txt

      - name: Run migrations, drift check, and PostgreSQL concurrency suite
        run: ./scripts/verify.sh postgres

      - name: Upload PostgreSQL verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postgres-verification-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
