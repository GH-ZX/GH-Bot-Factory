name: ${COMPOSE_PROJECT_NAME:?Run configure.py for an isolated project name}
x-app: &app
  image: ${GHBF_IMAGE:?Set a digest-pinned release image}
  env_file: .env
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  volumes:
    - secrets:/var/lib/ghbf/secret-store
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
services:
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    restart: unless-stopped
  tools:
    <<: *app
    profiles: [tools]
    restart: 'no'
    volumes:
      - secrets:/var/lib/ghbf/secret-store
      - .:/handoff:ro
    command: [python, -m, alembic, upgrade, head]
  api:
    <<: *app
    command: [uvicorn, apps.api.main:app, --host, 0.0.0.0, --port, '8010']
    ports:
      - '127.0.0.1:${API_HOST_PORT:-8010}:8010'
    depends_on: [redis]
    healthcheck:
      test: [CMD, python, scripts/healthcheck.py, api-deps]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    command: [python, -m, apps.worker.main]
    depends_on: [redis]
    healthcheck:
      test: [CMD, python, scripts/healthcheck.py, worker]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  bot-runtime:
    <<: *app
    command: [python, -m, apps.bot_runtime.main]
    depends_on: [redis]
    healthcheck:
      test: [CMD, python, scripts/healthcheck.py, bot-runtime]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
volumes:
  secrets:
  redis:
